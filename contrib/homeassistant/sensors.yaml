# Auriga llama-server monitoring sensors for Home Assistant
#
# Prerequisites:
#   1. Deploy auriga-cli with --metrics --slots flags (already in code)
#   2. Restart both llama-server instances
#   3. Install HACS cards: mushroom, mini-graph-card
#
# Usage:
#   Add to configuration.yaml:
#     rest: !include auriga_sensors.yaml
#
#   Or merge the rest: entries below into your existing configuration.yaml
#
# Adjust IP if using Tailscale (100.77.65.108) instead of LAN (100.77.65.108)

# --- Dense instance (port 8090) ---

# Health endpoint (JSON)
- resource: "http://100.77.65.108:8090/health"
  scan_interval: 15
  sensor:
    - name: "Auriga Dense Status"
      value_template: "{{ value_json.status }}"
      json_attributes:
        - slots_idle
        - slots_processing

# Metrics endpoint (Prometheus text format)
- resource: "http://100.77.65.108:8090/metrics"
  scan_interval: 10
  sensor:
    - name: "Auriga Dense PP Speed"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_prompt_tokens_seconds\s+([0-9.]+)') %}
        {{ m[0] | float | round(1) if m else 0 }}
      unit_of_measurement: "tok/s"
      icon: mdi:speedometer

    - name: "Auriga Dense TG Speed"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_tokens_predicted_seconds\s+([0-9.]+)') %}
        {{ m[0] | float | round(1) if m else 0 }}
      unit_of_measurement: "tok/s"
      icon: mdi:message-text-fast-outline

    - name: "Auriga Dense Prompt Tokens"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_prompt_tokens_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"
      icon: mdi:arrow-down-bold

    - name: "Auriga Dense Generated Tokens"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_tokens_predicted_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"
      icon: mdi:arrow-up-bold

    - name: "Auriga Dense KV Cache Usage"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_kv_cache_usage_ratio\s+([0-9.]+)') %}
        {{ (m[0] | float * 100) | round(1) if m else 0 }}
      unit_of_measurement: "%"
      icon: mdi:memory

    - name: "Auriga Dense KV Cache Tokens"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_kv_cache_tokens\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"
      icon: mdi:database

    - name: "Auriga Dense Active Requests"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_requests_processing\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      icon: mdi:server-network

    - name: "Auriga Dense Draft Accepted"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_spec_decode_num_accepted_tokens_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"

    - name: "Auriga Dense Draft Total"
      value_template: >-
        {% set m = value | regex_findall('llamacpp_spec_decode_num_draft_tokens_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"


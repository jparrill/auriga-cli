# Auriga llama-server monitoring sensors for Home Assistant
#
# Prerequisites:
#   1. Deploy auriga-cli with --metrics --slots flags (already in code)
#   2. Restart both llama-server instances
#   3. Install HACS cards: mushroom, mini-graph-card
#
# Usage:
#   Add to configuration.yaml:
#     rest: !include auriga_sensors.yaml

# --- Slot 1 (port 8090) ---

- resource: "http://100.77.65.108:8090/v1/models"
  scan_interval: 60
  sensor:
    - name: "Auriga Slot1 Model"
      value_template: >-
        {% set name = value_json.data[0].id | regex_findall('[^/]+$') %}
        {{ name[0] | regex_replace('\.gguf$', '') | regex_replace('-0000[0-9]+-of-[0-9]+', '') if name else 'unknown' }}
      icon: mdi:brain

    - name: "Auriga Slot1 Quant"
      value_template: "{{ value_json.data[0].meta.ftype }}"
      icon: mdi:numeric

    - name: "Auriga Slot1 Max Context"
      value_template: "{{ value_json.data[0].meta.n_ctx }}"
      unit_of_measurement: "tokens"
      icon: mdi:arrow-expand-horizontal

    - name: "Auriga Slot1 Modalities"
      value_template: >-
        {% set caps = value_json.data[0].aliases %}
        {{ value_json.models[0].capabilities | join(', ') }}
      icon: mdi:eye

- resource: "http://100.77.65.108:8090/health"
  scan_interval: 15
  sensor:
    - name: "Auriga Slot1 Status"
      value_template: "{{ value_json.status }}"
      icon: >-
        {{ 'mdi:server' if value_json.status == 'ok' else 'mdi:server-off' }}

- resource: "http://100.77.65.108:8090/slots"
  scan_interval: 15
  sensor:
    - name: "Auriga Slot1 Context Size"
      value_template: "{{ value_json[0].n_ctx | int }}"
      unit_of_measurement: "tokens"
      icon: mdi:text-box-outline

    - name: "Auriga Slot1 Processing"
      value_template: "{{ value_json[0].is_processing }}"
      icon: mdi:cog-transfer

    - name: "Auriga Slot1 Speculative"
      value_template: "{{ value_json[0].speculative }}"
      icon: mdi:lightning-bolt

- resource: "http://100.77.65.108:8090/metrics"
  scan_interval: 10
  sensor:
    - name: "Auriga Slot1 PP Speed"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:prompt_tokens_seconds\s+([0-9.]+)') %}
        {{ m[0] | float | round(1) if m else 0 }}
      unit_of_measurement: "tok/s"
      icon: mdi:speedometer

    - name: "Auriga Slot1 TG Speed"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:predicted_tokens_seconds\s+([0-9.]+)') %}
        {{ m[0] | float | round(1) if m else 0 }}
      unit_of_measurement: "tok/s"
      icon: mdi:message-text-fast-outline

    - name: "Auriga Slot1 Prompt Tokens"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:prompt_tokens_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"
      icon: mdi:arrow-down-bold

    - name: "Auriga Slot1 Generated Tokens"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:tokens_predicted_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"
      icon: mdi:arrow-up-bold

    - name: "Auriga Slot1 Active Requests"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:requests_processing\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      icon: mdi:server-network

    - name: "Auriga Slot1 Draft Accepted"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:spec_decode_num_accepted_tokens_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"

    - name: "Auriga Slot1 Draft Total"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:spec_decode_num_draft_tokens_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"

    - name: "Auriga Slot1 Cached Tokens"
      value_template: >-
        {% set m = value | regex_findall('llamacpp:prompt_tokens_cached_total\s+([0-9.]+)') %}
        {{ m[0] | int if m else 0 }}
      unit_of_measurement: "tokens"
      icon: mdi:cached


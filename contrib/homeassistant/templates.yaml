# Template sensors for computed Auriga metrics
#
# Add to configuration.yaml:
#   template: !include auriga_templates.yaml

- sensor:
    # Draft Acceptance Rate (DAR) for Slot 1
    - name: "Auriga Slot1 DAR"
      state: >-
        {% set accepted = states('sensor.auriga_slot1_draft_accepted') | int(0) %}
        {% set total = states('sensor.auriga_slot1_draft_total') | int(0) %}
        {{ ((accepted / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      icon: mdi:check-decagram

    # Draft Acceptance Rate (DAR) for Slot 2
    - name: "Auriga Slot2 DAR"
      state: >-
        {% set accepted = states('sensor.auriga_slot2_draft_accepted') | int(0) %}
        {% set total = states('sensor.auriga_slot2_draft_total') | int(0) %}
        {{ ((accepted / total) * 100) | round(1) if total > 0 else 0 }}
      unit_of_measurement: "%"
      icon: mdi:check-decagram

    # Cache hit ratio for Slot 1
    - name: "Auriga Slot1 Cache Hit"
      state: >-
        {% set cached = states('sensor.auriga_slot1_cached_tokens') | int(0) %}
        {% set total = states('sensor.auriga_slot1_prompt_tokens') | int(0) %}
        {% set all_tokens = cached + total %}
        {{ ((cached / all_tokens) * 100) | round(1) if all_tokens > 0 else 0 }}
      unit_of_measurement: "%"
      icon: mdi:cached

    # Cache hit ratio for Slot 2
    - name: "Auriga Slot2 Cache Hit"
      state: >-
        {% set cached = states('sensor.auriga_slot2_cached_tokens') | int(0) %}
        {% set total = states('sensor.auriga_slot2_prompt_tokens') | int(0) %}
        {% set all_tokens = cached + total %}
        {{ ((cached / all_tokens) * 100) | round(1) if all_tokens > 0 else 0 }}
      unit_of_measurement: "%"
      icon: mdi:cached
